name: Auto Crawler & Update Index

on:
  workflow_dispatch: # Bisa dijalankan manual lewat tab Actions

permissions:
  contents: write

jobs:
  run-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiohttp beautifulsoup4

      - name: Run Crawler Script
        run: python crawler.py

      - name: Commit and Push to data/index
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Cek apakah file JSON-nya benar-benar ada/terbentuk
          if [ -f "data/index/search_index.json" ]; then
              git add data/index/search_index.json
              git commit -m "Auto-update search index data [skip ci]" || echo "No changes to commit"
              
              # Tentukan branch secara dinamis agar push tidak gagal
              git push origin HEAD
          else
              echo "Error: File search_index.json tidak ditemukan, crawler mungkin gagal!"
              exit 1
          fi
