name: Deevv Automated Crawler

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari jam 00:00 UTC
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions di GitHub

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Crawler Script
        run: |
          python crawler.py

      # --- BLOK KODE YANG KAMU TANYAKAN DI TARUH DI SINI ---
      - name: Commit and Push Results
        run: |
          git config --global user.name "Deevv Bot"
          git config --global user.email "bot@deevv.internal"
          git add data/index/deevv_index.json
          git commit -m "Auto-update search index inside data folder" || echo "No changes to commit"
          git push
