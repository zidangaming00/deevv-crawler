name: Auto Crawler & Update Index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiohttp beautifulsoup4

      - name: Run Crawler Script
        run: python crawler.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/index/
          git commit -m "Auto-update search index data [skip ci]" || echo "No changes to commit"
          git pull origin main --rebase || echo "No remote changes to pull"
          git push origin HEAD
