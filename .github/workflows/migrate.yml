name: Migrate Last Modified Data

on:
  workflow_dispatch: # Mengizinkan eksekusi manual via tombol di GitHub

jobs:
  run-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4 libsql-client

      - name: Run Migration Script
        env:
          # Mengambil secret yang sudah kamu pasang sebelumnya
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python migrate_last_modified.py
