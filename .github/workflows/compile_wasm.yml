name: Compile C++ to WASM

on:
  workflow_dispatch:
  push:
    paths:
      - 'search_wasm.cxx'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Emscripten toolchain
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Download SQLite Amalgamation
        run: |
          wget https://www.sqlite.org/2023/sqlite-amalgamation-3420000.zip
          unzip -o sqlite-amalgamation-3420000.zip
          cp sqlite-amalgamation-3420000/sqlite3.c .
          cp sqlite-amalgamation-3420000/sqlite3.h .

      - name: Compile C++ to WASM
        run: |
          mkdir -p functions/api
          em++ search_wasm.cxx sqlite3.c -o functions/api/search_engine.js \
            -s WASM=1 \
            -s EXPORT_ES6=1 \
            -s MODULARIZE=1 \
            -s ENVIRONMENT='worker' \
            -s FORCE_FILESYSTEM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -DSQLITE_THREADSAFE=0 \
            -DSQLITE_OMIT_LOAD_EXTENSION \
            --bind \
            -O3

      - name: Commit & Push WASM Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add functions/api/search_engine.js functions/api/search_engine.wasm
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada file WASM."
          else
            git commit -m "Auto-compile search_wasm.cxx to WASM [skip ci]"
            git push
          fi
