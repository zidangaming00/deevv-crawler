name: Compile C++ to WASM

on:
  push:
    paths:
      - 'search_wasm.cxx' # Otomatis berjalan setiap kali file C++ di-update

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Emscripten toolchain
        uses: mymindstorm/setup-emsdk@v12
        with:
          version: 'latest'

      - name: Download SQLite Amalgamation
        run: |
          wget https://www.sqlite.org/2023/sqlite-amalgamation-3420000.zip
          unzip sqlite-amalgamation-3420000.zip
          cp sqlite-amalgamation-3420000/sqlite3.c .
          cp sqlite-amalgamation-3420000/sqlite3.h .

      - name: Compile C++ to WASM
        run: |
          mkdir -p functions/api
          emcc search_wasm.cxx sqlite3.c -o functions/api/search_engine.js \
            -s WASM=1 \
            -s EXPORT_ES6=1 \
            -s MODULARIZE=1 \
            -s ENVIRONMENT='worker' \
            -s FORCE_FILESYSTEM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            --bind \
            -O3

      - name: Commit & Push WASM Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add functions/api/search_engine.js functions/api/search_engine.wasm
          git commit -m "Auto-compile search_wasm.cxx to WASM [skip ci]" || exit 0
          git push
